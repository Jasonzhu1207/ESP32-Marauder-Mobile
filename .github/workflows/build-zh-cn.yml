name: Build 简体中文版 APK

on:
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: "构建前先合并上游 0xsys/ESP32-Marauder-Mobile 的 main（仅在构建环境中，不改动本仓库分支）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-zh-cn
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 合并上游到构建工作区 (不改动本仓库分支)
        if: ${{ inputs.sync_upstream }}
        env:
          UPSTREAM_URL: https://github.com/0xsys/ESP32-Marauder-Mobile.git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream main
          git merge --no-edit upstream/main

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 应用简体中文翻译
        run: python3 i18n/apply_zh_cn.py

      - name: 准备签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > zh-cn-release.jks
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PASS="$KEY_PASSWORD"
          else
            echo "::warning::未配置 KEYSTORE_BASE64 secret，使用临时签名密钥。每次构建签名都不同，已安装的旧版本无法直接覆盖升级。"
            STORE_PASS="$(openssl rand -hex 16)"
            ALIAS="zhcn"
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -keystore zh-cn-release.jks -storepass "$STORE_PASS" \
              -alias "$ALIAS" -keypass "$KEY_PASS" -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=zh-cn-build"
          fi
          {
            echo "storeFile=zh-cn-release.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties

      - name: 构建 Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: 整理产物
        id: apk
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          OUT="marauder-zh-CN-v${VERSION}.apk"
          cp "$APK" "$OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: marauder-zh-CN
          path: ${{ steps.apk.outputs.apk }}

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.apk.outputs.version }}
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          set -euo pipefail
          TAG="zh-cn-v${VERSION}-r${GITHUB_RUN_NUMBER}"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" "$APK" \
            --title "简体中文版 v${VERSION}" \
            --notes "Marauder Mobile 简体中文版，基于上游 main 自动构建（构建源码：$(git rev-parse --short HEAD)）。仅汉化界面文字，串口协议与固件命令保持原样。"
